[project]
name = "warehouse"
version = "0.1.0"
description = "Warehouse inventory & fulfillment: robot picking, shelf vision, demand forecasting, order-routing agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
warehouse-sim = "warehouse.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warehouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
